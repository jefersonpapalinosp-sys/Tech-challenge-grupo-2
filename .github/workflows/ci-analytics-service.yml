name: CI analytics-service

on:
  pull_request:
    paths:
      - "fase3/analytics-service/**"
      - "fase3/.flake8"
      - ".github/workflows/ci-analytics-service.yml"
      - ".github/workflows/_service-ci.yml"
  push:
    branches: [main]
    paths:
      - "fase3/analytics-service/**"
      - "fase3/.flake8"
      - ".github/workflows/ci-analytics-service.yml"
      - ".github/workflows/_service-ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-analytics-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    permissions:
      contents: write
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: analytics-service
      language: python
    secrets: inherit
